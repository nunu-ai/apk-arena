name: Build and Upload to nunu.ai

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p build/upload
          cp build/app/outputs/flutter-apk/app-release.apk build/upload/apk_arena.apk

      - name: Upload to nunu.ai
        uses: nunu-ai/upload-build-action@v1
        with:
          api-token: ${{ secrets.NUNU_API_TOKEN }}
          project-id: ${{ secrets.NUNU_PROJECT_ID }}
          file: "build/upload/apk_arena.apk"
          name: "APK Arena Android ${{ github.run_number }}"

      - name: Upload APK artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: apk-arena-${{ github.run_number }}
          path: build/upload/apk_arena.apk